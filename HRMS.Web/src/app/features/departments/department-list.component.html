<app-loading-spinner />

<app-page-header
  title="Departments"
  subtitle="Organisational units and their managers"
  icon="apartment"
>
  <button mat-flat-button color="primary" (click)="openCreate()">
    <mat-icon>add</mat-icon>
    Add Department
  </button>
</app-page-header>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" color="primary" />
}

@if (error()) {
  <p class="error-text">{{ error() }}</p>
}

<mat-card class="card">
  <mat-card-content>
    @if (departments().length > 0) {
      <div class="table-wrapper">
        <table mat-table [dataSource]="departments()">
          <ng-container matColumnDef="code">
            <th mat-header-cell *matHeaderCellDef>Code</th>
            <td mat-cell *matCellDef="let row">{{ row.code }}</td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let row">{{ row.name }}</td>
          </ng-container>

          <ng-container matColumnDef="manager">
            <th mat-header-cell *matHeaderCellDef>Manager</th>
            <td mat-cell *matCellDef="let row">{{ row.managerName || '—' }}</td>
          </ng-container>

          <ng-container matColumnDef="employeeCount">
            <th mat-header-cell *matHeaderCellDef>Employees</th>
            <td mat-cell *matCellDef="let row">{{ row.employeeCount ?? 0 }}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="actions-col">Actions</th>
            <td mat-cell *matCellDef="let row" class="actions-col">
              <button mat-icon-button color="primary" (click)="openEdit(row)" matTooltip="Edit">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="confirmDelete(row)" matTooltip="Delete">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </div>
    } @else {
      <app-empty-state
        message="No departments yet"
        icon="apartment"
        hint="Click 'Add Department' to create your first one."
      />
    }
  </mat-card-content>
</mat-card>
